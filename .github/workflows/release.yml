name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      # --- Install all frontend dependencies (npm workspaces) ---
      # Delete lockfile so npm resolves platform-specific optional deps (rolldown bindings) for the current CI runner
      - name: Install frontend dependencies
        shell: bash
        run: |
          rm -f package-lock.json
          npm install

      # --- ModbusSlave ---
      - name: Build slave frontend
        working-directory: frontend
        run: npm run build

      - name: Build and release ModbusSlave
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/modbussim-app
          tagName: ${{ github.ref_name }}
          releaseName: 'ModbusSim ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads

            **ModbusSlave** - Modbus TCP 从站模拟器
            **ModbusMaster** - Modbus TCP 主站工具

            See the assets below to download for your platform.
          # Keep the release a draft during the build: GitHub's
          # `releases/latest` skips drafts, so existing users' update checks
          # keep hitting the previous *complete* release. publish-manifest
          # clears the draft flag once installers + manifest are all in.
          releaseDraft: true
          prerelease: false
          # The project ships its own latest-slave/master.json via
          # gen-update-manifest; tauri-action's latest.json is unused. Being a
          # single shared filename, every parallel matrix job clobbers it —
          # a known "delete-a-release-asset" 404 race. Skip it.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # --- ModbusMaster ---
      - name: Build master frontend
        working-directory: master-frontend
        run: npm run build

      - name: Build and release ModbusMaster
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/modbusmaster-app
          tagName: ${{ github.ref_name }}
          releaseName: 'ModbusSim ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads

            **ModbusSlave** - Modbus TCP 从站模拟器
            **ModbusMaster** - Modbus TCP 主站工具

            See the assets below to download for your platform.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  publish-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Un-draft first: this job only runs once every build succeeded, so the
      # release is now complete enough to go live. Publishing here (rather than
      # last) lets the manifest script run against a normal published release
      # — `releases/tags/<tag>` and public asset URLs all work. The residual
      # window where `releases/latest` lacks the update manifest shrinks from
      # the whole build to the few seconds of manifest generation.
      - name: Publish release (clear draft flag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false
      - name: Generate manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gen-update-manifest.mjs ${{ github.ref_name }}
      - name: Upload manifests to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload ${{ github.ref_name }} \
              latest-slave.json latest-slave-cn0.json latest-slave-cn1.json latest-slave-cn2.json latest-slave-cn3.json \
              latest-master.json latest-master-cn0.json latest-master-cn1.json latest-master-cn2.json latest-master-cn3.json \
              --clobber; then exit 0; fi
            echo "::warning::manifest upload attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "::error::manifest upload failed after 5 attempts"; exit 1
