[workspace]
members = [
    "crates/modbussim-core",
    "crates/modbussim-app",
    "crates/modbusmaster-app",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
log = "0.4"
modbussim-core = { path = "crates/modbussim-core" }
